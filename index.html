        /* 右端の細いナビ（固定） */
        .side-nav {
            position: fixed;
            /* 画面スクロールしても固定 */
            right: -5px;
            /* さらに右へ */
            top: 80%;
            /* 画面中央に固定 */
            transform: translateY(-50%) translateX(16px);
            /* 中央配置と右ずらし */
            background: #bd9888;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4px;
            border-radius: 10px 0 0 10px;
            z-index: 1000;
            width: 35px;
            /* さらに細く */
        }

        .side-nav a:active {
            transform: scale(1.0);
            /* タップした後に元のサイズに戻す */
        }

        .side-nav a {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 10px;
            margin: 5px 0;
            padding: 5px;
            transition: background 0.3s, transform 0.2s;
            border-radius: 5px;
            width: 30px;
            height: 30px;
            text-align: center;
        }

        .side-nav a span {
            font-size: 24px;
            /* 矢印をさらに大きく */
            position: absolute;
            left: 2px;
            /* 左端に寄せる */
            top: 13px;
            /* さらに下へ */
        }

        /* スマホ用の微調整 */
        @media (max-width: 600px) {
            .side-nav {
                right: 2px;
                /* スマホではさらに右端に */
                width: 30px;
                /* もっと細く */
            }

            .side-nav a {
                width: 28px;
                height: 28px;
            }

            .side-nav a i {
                font-size: 12px;
                /* スマホではもっと小さく */
            }
        }

/* ベース：二列レイアウトそのまま（PC/タブレットは自由） */
.irradiations {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  gap: 8px 10px; /* 縦:8px / 横:10px */
}

/* ボタン共通 */
.irradiations button {
  /* 可変幅（PC/タブレット） */
  flex: 0 0 auto;
  width: auto;
  min-width: 0;             /* はみ出し防止（iOS対策） */
  box-sizing: border-box;

  padding: 8px 6px;
  font-size: 11.5px;
  line-height: 1.2;
  white-space: normal;
  text-align: center;

  /* 下に説明テキストを積む */
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* 下1行テキスト（data-note）→ 最大3行で省略 */
.irradiations button::after {
  content: attr(data-note);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;

  /* 改行(LF)を反映 */
  white-space: pre-line;
  line-height: 1.3;
  max-height: calc(1.3em * 3);
  width: 100%;
  word-break: break-word;
  margin-top: 4px;
  font-size: 12px;
  color: #666;
}

/* ▼スマホ（横幅768px以下）は“縦1列” */
@media (max-width: 768px) {
  .irradiations {
    flex-direction: column; /* ←ここを追加：縦並びにする */

  .irradiations button {

    max-width: 100%; /* ←同上 */
    font-size: 12px;  /* 視認性を少しUP */

  }
}
